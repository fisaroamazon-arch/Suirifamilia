<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suiri - Espaço Masculino</title>

    <!-- Configurações e Cores da Forja Romana / Medieval -->
    <meta name="theme-color" content="#0c0f14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icone.jpg">

    <!-- Tipografia e Estilos Dedicados -->
    <link rel="stylesheet" href="css-base.css">
    <link rel="stylesheet" href="css-modulos.css">
    <link rel="stylesheet" href="css-modais.css">

    <!-- Dependências Externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            /* Paleta Forja Romana / Ferro Forjado & Brasas */
            --cor-primaria-masc: #f97316;
            --cor-secundaria-masc: #ea580c;
            --texto-titulo-masc: #f8fafc;
            --bg-forja: #181d28;
            --borda-masc: #334155;
            --cor-aco: #94a3b8;
            --cor-brasa: #ffedd5;
        }

        /* =========================================================================
           CAMADA 0: VÍDEO DE FUNDO 1080p ADAPTATIVO TELA CHEIA (SEM ESTOURAR)
           ========================================================================= */
        #container-video-fundo {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            overflow: hidden !important;
            z-index: 0 !important;
            pointer-events: none !important;
            margin: 0 !important;
            padding: 0 !important;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }

        #video-cenario-fundo {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: cover !important;
            object-position: center center !important;
            pointer-events: none !important;
            filter: contrast(120%) saturate(150%) brightness(108%);
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }

        #container-video-fundo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: transparent !important;
            pointer-events: none;
        }

        body {
            background: transparent !important;
            min-height: 100vh;
            padding: 14px 10px 45px 10px;
            color: #e2e8f0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .container-homem {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .oculto {
            display: none !important;
        }

        .bottom-nav-fixa-inferior, .bottom-nav {
            display: none !important;
        }

        /* =========================================================================
           TRANSPARÊNCIA TOTAL DOS QUADROS E TRANSIÇÃO GRADUAL PARA VIDRO
           ========================================================================= */
        /* Estado 1 (Primeiros 8 segundos): Totalmente transparente para assistir ao fogo */
        .cartao-geral {
            background: transparent !important;
            border: 1.5px solid rgba(249, 115, 22, 0.45) !important;
            border-left: 4px solid #ea580c !important;
            backdrop-filter: blur(0px) !important;
            -webkit-backdrop-filter: blur(0px) !important;
            box-shadow: none !important;
            border-radius: 18px !important;
            color: #f8fafc !important;
            transition: background 2.5s ease, backdrop-filter 2.5s ease, -webkit-backdrop-filter 2.5s ease, box-shadow 2.5s ease, border-color 2.5s ease !important;
        }

        /* Caixas internas, sliders e campos transparentes nos primeiros 8s */
        .cartao-geral div[style*="background"],
        .cartao-geral input[type="text"],
        .cartao-geral input[type="date"],
        .cartao-geral label[style*="background"] {
            background: rgba(15, 20, 30, 0.15) !important;
            border-color: rgba(148, 163, 184, 0.25) !important;
            transition: background 2.5s ease, border-color 2.5s ease !important;
        }

        /* Estado 2 (Após 8 segundos): Transição suave para Vidro Escuro Fumê */
        body.modo-vidro .cartao-geral {
            background: rgba(15, 20, 30, 0.72) !important;
            border: 1px solid rgba(148, 163, 184, 0.28) !important;
            border-left: 4px solid #ea580c !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
        }

        body.modo-vidro .cartao-geral div[style*="background"],
        body.modo-vidro .cartao-geral label[style*="background"] {
            background: rgba(30, 41, 59, 0.65) !important;
            border-color: rgba(71, 85, 105, 0.5) !important;
        }

        body.modo-vidro .cartao-geral input[type="text"],
        body.modo-vidro .cartao-geral input[type="date"] {
            background: rgba(15, 23, 42, 0.75) !important;
            border-color: rgba(71, 85, 105, 0.6) !important;
        }

        /* Sombras nos textos para garantir leitura límpida sobre o vídeo */
        .cartao-geral p, .cartao-geral span, .cartao-geral strong, .cartao-geral h1, .cartao-geral h3 {
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 2px #000000;
        }

        /* Ampliação de ícones (+20%) */
        img[src*="./icone/"],
        img[src*="icone/"],
        .icone-svg,
        .icone-sistema-img {
            transform: scale(1.2);
            transform-origin: center center;
            display: inline-block;
            vertical-align: middle;
        }

        button img[src*="./icone/"],
        label img[src*="./icone/"],
        span img[src*="./icone/"] {
            margin-left: 2px;
            margin-right: 2px;
        }

        /* =========================================================================
           CAMADA 1: ANIMAÇÃO DE FAGULHAS E BRASAS EXPANDIDA
           ========================================================================= */
        #container-fogo-fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .brasa-suiri {
            position: absolute;
            bottom: -35px;
            background: radial-gradient(circle, rgba(254, 215, 170, 1) 0%, rgba(249, 115, 22, 0.9) 35%, rgba(239, 68, 68, 0.65) 70%, rgba(185, 28, 28, 0) 100%);
            border-radius: 50%;
            filter: blur(0.5px);
            box-shadow: 0 0 14px rgba(249, 115, 22, 0.85), 0 0 4px rgba(254, 215, 170, 0.9);
            animation: subirBrasa linear infinite;
        }

        @keyframes subirBrasa {
            0% { 
                transform: translateY(0) scale(0.5) translateX(0); 
                opacity: 0; 
            }
            12% { 
                opacity: 0.95; 
            }
            45% { 
                transform: translateY(-45vh) scale(1.15) translateX(16px); 
                opacity: 0.85; 
            }
            75% { 
                transform: translateY(-80vh) scale(0.85) translateX(-12px); 
                opacity: 0.6; 
            }
            100% { 
                transform: translateY(-115vh) scale(0.35) translateX(18px); 
                opacity: 0; 
            }
        }

        .brasa-1  { left: 4%;  width: 5px; height: 8px;  animation-duration: 7.5s; animation-delay: 0s; }
        .brasa-2  { left: 10%; width: 8px; height: 12px; animation-duration: 9.5s; animation-delay: 1.2s; }
        .brasa-3  { left: 16%; width: 4px; height: 7px;  animation-duration: 6.8s; animation-delay: 3.5s; }
        .brasa-4  { left: 22%; width: 9px; height: 13px; animation-duration: 11.2s; animation-delay: 0.6s; }
        .brasa-5  { left: 28%; width: 6px; height: 10px; animation-duration: 8.2s; animation-delay: 4.1s; }
        .brasa-6  { left: 34%; width: 4px; height: 6px;  animation-duration: 6.2s; animation-delay: 2.3s; }
        .brasa-7  { left: 40%; width: 7px; height: 11px; animation-duration: 10.5s; animation-delay: 5.0s; }
        .brasa-8  { left: 47%; width: 5px; height: 8px;  animation-duration: 7.8s; animation-delay: 1.8s; }
        .brasa-9  { left: 53%; width: 10px; height: 15px; animation-duration: 12.0s; animation-delay: 0.3s; }
        .brasa-10 { left: 60%; width: 4px; height: 7px;  animation-duration: 6.5s; animation-delay: 3.1s; }
        .brasa-11 { left: 66%; width: 8px; height: 12px; animation-duration: 9.8s; animation-delay: 4.7s; }
        .brasa-12 { left: 72%; width: 6px; height: 9px;  animation-duration: 8.4s; animation-delay: 2.0s; }
        .brasa-13 { left: 78%; width: 4px; height: 6px;  animation-duration: 6.9s; animation-delay: 5.6s; }
        .brasa-14 { left: 83%; width: 9px; height: 14px; animation-duration: 10.8s; animation-delay: 1.0s; }
        .brasa-15 { left: 88%; width: 5px; height: 8px;  animation-duration: 7.2s; animation-delay: 3.8s; }
        .brasa-16 { left: 93%; width: 7px; height: 11px; animation-duration: 9.0s; animation-delay: 0.8s; }
        .brasa-17 { left: 48%; width: 3px; height: 5px;  animation-duration: 5.8s; animation-delay: 4.3s; }
        .brasa-18 { left: 96%; width: 4px; height: 7px;  animation-duration: 6.6s; animation-delay: 2.7s; }
    </style>
</head>
<body>

    <!-- CAMADA 0: VÍDEO 1080P EM TELA CHEIA (CONGELA NO ÚLTIMO FRAME) -->
    <div id="container-video-fundo">
        <video id="video-cenario-fundo" autoplay muted playsinline webkit-playsinline preload="auto">
            <source src="fogo.mp4" type="video/mp4">
        </video>
    </div>

    <!-- CAMADA 1: FLUXO DE FAGULHAS E BRASAS FLUTUANTES -->
    <div id="container-fogo-fundo">
        <div class="brasa-suiri brasa-1"></div>
        <div class="brasa-suiri brasa-2"></div>
        <div class="brasa-suiri brasa-3"></div>
        <div class="brasa-suiri brasa-4"></div>
        <div class="brasa-suiri brasa-5"></div>
        <div class="brasa-suiri brasa-6"></div>
        <div class="brasa-suiri brasa-7"></div>
        <div class="brasa-suiri brasa-8"></div>
        <div class="brasa-suiri brasa-9"></div>
        <div class="brasa-suiri brasa-10"></div>
        <div class="brasa-suiri brasa-11"></div>
        <div class="brasa-suiri brasa-12"></div>
        <div class="brasa-suiri brasa-13"></div>
        <div class="brasa-suiri brasa-14"></div>
        <div class="brasa-suiri brasa-15"></div>
        <div class="brasa-suiri brasa-16"></div>
        <div class="brasa-suiri brasa-17"></div>
        <div class="brasa-suiri brasa-18"></div>
    </div>

    <main class="container-homem">
        <section id="secao-espaco-masculino"></section>
    </main>

    <div id="toast-container"></div>

    <script src="app-core.js"></script>
    <script src="app-dicas-masculinas.js"></script>
    <script src="app-espaco-masculino.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const vidFundo = document.getElementById('video-cenario-fundo');
            if (vidFundo) {
                // Compatibilidade estrita para WebKit iOS (iPhone) e Android
                vidFundo.muted = true;
                vidFundo.setAttribute('muted', '');
                vidFundo.setAttribute('playsinline', '');
                vidFundo.setAttribute('webkit-playsinline', '');

                vidFundo.addEventListener('ended', () => {
                    vidFundo.pause();
                });

                const tentarReproduzir = () => {
                    const promessa = vidFundo.play();
                    if (promessa !== undefined) {
                        promessa.catch(() => {
                            vidFundo.load();
                            vidFundo.play().catch(() => {});
                        });
                    }
                };

                tentarReproduzir();
                document.body.addEventListener('touchstart', () => {
                    if (vidFundo.paused && !vidFundo.ended) {
                        tentarReproduzir();
                    }
                }, { once: true });
            }

            // Exatamente 8 segundos de transparência total antes de ativar o vidro suave
            setTimeout(() => {
                document.body.classList.add('modo-vidro');
            }, 8000);

            const perfilRaw = localStorage.getItem('suiri_perfil_ativo') || localStorage.getItem('suiri_ultimo_perfil');
            let perfil = {};
            try {
                perfil = JSON.parse(perfilRaw || '{}');
            } catch (e) {
                perfil = {};
            }

            if (perfil.sexo && perfil.sexo.toLowerCase() === 'feminino') {
                if (typeof window.mostrarToast === 'function') {
                    window.mostrarToast("Acesso restrito ao Espaço Masculino.", "erro");
                }
                setTimeout(() => {
                    window.location.replace('index.html');
                }, 400);
                return;
            }

            window.fecharEspacoMasculino = function() {
                window.location.href = 'index.html';
            };

            if (typeof window.renderizarEsqueletoEspacoMasculino === 'function') {
                window.renderizarEsqueletoEspacoMasculino();
                if (typeof window.renderizarReflexaoEstoica === 'function') window.renderizarReflexaoEstoica(false);
                if (typeof window.renderizarListaFavoritasEstoicas === 'function') window.renderizarListaFavoritasEstoicas();
                if (typeof window.renderizarBotoesForja === 'function') window.renderizarBotoesForja();
                if (typeof window.renderizarHistoricoForja === 'function') window.renderizarHistoricoForja();
                if (typeof window.renderizarHistoricoRadarIntimo === 'function') window.renderizarHistoricoRadarIntimo();
                if (typeof window.atualizarVisualizacaoMidia === 'function') window.atualizarVisualizacaoMidia();
                if (typeof window.renderizarHistoricoAssistidos === 'function') window.renderizarHistoricoAssistidos();
                if (typeof window.renderizarListasMasculinas === 'function') window.renderizarListasMasculinas();

                if (typeof window.carregarDadosNuvemEspacoMasculino === 'function') {
                    try {
                        await window.carregarDadosNuvemEspacoMasculino();
                    } catch (e) {
                        console.warn("Base local ativa para o Espaço Masculino.");
                    }
                }
            }
        });
    </script>
</body>
</html>

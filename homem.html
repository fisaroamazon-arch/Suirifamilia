<!DOCTYPE html>

    <style>
        :root {
            /* Paleta Forja Romana / Ferro Forjado & Brasas */
            --cor-primaria-masc: #f97316;
            --cor-secundaria-masc: #ea580c;
            --texto-titulo-masc: #f8fafc;
            --bg-forja: #181d28;
            --borda-masc: #334155;
            --cor-aco: #94a3b8;
            --cor-brasa: #ffedd5;
        }

        /* =========================================================================
           CAMADA 0: VÍDEO DE FUNDO 1080p ADAPTATIVO TELA CHEIA (SEM ESTOURAR)
           ========================================================================= */
        #container-video-fundo {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            overflow: hidden !important;
            z-index: 0 !important;
            pointer-events: none !important;
            margin: 0 !important;
            padding: 0 !important;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }

        #video-cenario-fundo {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: cover !important;
            object-position: center center !important;
            pointer-events: none !important;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            filter: blur(0px);
            -webkit-filter: blur(0px);
            transition: filter 2.5s ease, -webkit-filter 2.5s ease;
        }

        body.modo-vidro #video-cenario-fundo {
            filter: blur(4px);
            -webkit-filter: blur(4px);
        }

        #container-video-fundo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: transparent !important;
            pointer-events: none;
        }

        body {
            background: transparent !important;
            min-height: 100vh;
            padding: 14px 10px 45px 10px;
            color: #e2e8f0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .container-homem {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .oculto {
            display: none !important;
        }

        .bottom-nav-fixa-inferior, .bottom-nav {
            display: none !important;
        }

        /* =========================================================================
           TRANSPARÊNCIA TOTAL DOS QUADROS E TRANSIÇÃO GRADUAL PARA VIDRO
           ========================================================================= */
        .cartao-geral {
            background: transparent !important;
            border: 1.5px solid rgba(249, 115, 22, 0.45) !important;
            border-left: 4px solid #ea580c !important;
            backdrop-filter: blur(0px) !important;
            -webkit-backdrop-filter: blur(0px) !important;
            box-shadow: none !important;
            border-radius: 18px !important;
            color: #f8fafc !important;
            transition: background 2.5s ease, backdrop-filter 2.5s ease, -webkit-backdrop-filter 2.5s ease, box-shadow 2.5s ease, border-color 2.5s ease !important;
        }

        .cartao-geral div[style*="background"],
        .cartao-geral input[type="text"],
        .cartao-geral input[type="date"],
        .cartao-geral label[style*="background"] {
            background: rgba(15, 20, 30, 0.15) !important;
            border-color: rgba(148, 163, 184, 0.25) !important;
            transition: background 2.5s ease, border-color 2.5s ease !important;
        }

        body.modo-vidro .cartao-geral {
            background: rgba(15, 20, 30, 0.72) !important;
            border: 1px solid rgba(148, 163, 184, 0.28) !important;
            border-left: 4px solid #ea580c !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
        }

        body.modo-vidro .cartao-geral div[style*="background"],
        body.modo-vidro .cartao-geral label[style*="background"] {
            background: rgba(30, 41, 59, 0.65) !important;
            border-color: rgba(71, 85, 105, 0.5) !important;
        }

        body.modo-vidro .cartao-geral input[type="text"],
        body.modo-vidro .cartao-geral input[type="date"] {
            background: rgba(15, 23, 42, 0.75) !important;
            border-color: rgba(71, 85, 105, 0.6) !important;
        }

        .cartao-geral p, .cartao-geral span, .cartao-geral strong, .cartao-geral h1, .cartao-geral h3 {
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 0 2px #000000;
        }

        img[src*="./icone/"],
        img[src*="icone/"],
        .icone-svg,
        .icone-sistema-img {
            transform: scale(1.2);
            transform-origin: center center;
            display: inline-block;
            vertical-align: middle;
        }

        button img[src*="./icone/"],
        label img[src*="./icone/"],
        span img[src*="./icone/"] {
            margin-left: 2px;
            margin-right: 2px;
        }

        /* =========================================================================
           CAMADA 1: ANIMAÇÃO DE FAGULHAS E BRASAS EXPANDIDA
           ========================================================================= */
        #container-fogo-fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .brasa-suiri {
            position: absolute;
            bottom: -35px;
            background: radial-gradient(circle, rgba(254, 215, 170, 1) 0%, rgba(249, 115, 22, 0.9) 35%, rgba(239, 68, 68, 0.65) 70%, rgba(185, 28, 28, 0) 100%);
            border-radius: 50%;
            filter: blur(0.5px);
            box-shadow: 0 0 14px rgba(249, 115, 22, 0.85), 0 0 4px rgba(254, 215, 170, 0.9);
            animation: subirBrasa linear infinite;
        }

        @keyframes subirBrasa {
            0% { 
                transform: translateY(0) scale(0.5) translateX(0); 
                opacity: 0; 
            }
            12% { 
                opacity: 0.95; 
            }
            45% { 
                transform: translateY(-45vh) scale(1.15) translateX(16px); 
                opacity: 0.85; 
            }
            75% { 
                transform: translateY(-80vh) scale(0.85) translateX(-12px); 
                opacity: 0.6; 
            }
            100% { 
                transform: translateY(-115vh) scale(0.35) translateX(18px); 
                opacity: 0; 
            }
        }

        .brasa-1  { left: 4%;  width: 5px; height: 8px;  animation-duration: 7.5s; animation-delay: 0s; }
        .brasa-2  { left: 10%; width: 8px; height: 12px; animation-duration: 9.5s; animation-delay: 1.2s; }
        .brasa-3  { left: 16%; width: 4px; height: 7px;  animation-duration: 6.8s; animation-delay: 3.5s; }
        .brasa-4  { left: 22%; width: 9px; height: 13px; animation-duration: 11.2s; animation-delay: 0.6s; }
        .brasa-5  { left: 28%; width: 6px; height: 10px; animation-duration: 8.2s; animation-delay: 4.1s; }
        .brasa-6  { left: 34%; width: 4px; height: 6px;  animation-duration: 6.2s; animation-delay: 2.3s; }
        .brasa-7  { left: 40%; width: 7px; height: 11px; animation-duration: 10.5s; animation-delay: 5.0s; }
        .brasa-8  { left: 47%; width: 5px; height: 8px;  animation-duration: 7.8s; animation-delay: 1.8s; }
        .brasa-9  { left: 53%; width: 10px; height: 15px; animation-duration: 12.0s; animation-delay: 0.3s; }
        .brasa-10 { left: 60%; width: 4px; height: 7px;  animation-duration: 6.5s; animation-delay: 3.1s; }
        .brasa-11 { left: 66%; width: 8px; height: 12px; animation-duration: 9.8s; animation-delay: 4.7s; }
        .brasa-12 { left: 72%; width: 6px; height: 9px;  animation-duration: 8.4s; animation-delay: 2.0s; }
        .brasa-13 { left: 78%; width: 4px; height: 6px;  animation-duration: 6.9s; animation-delay: 5.6s; }
        .brasa-14 { left: 83%; width: 9px; height: 14px; animation-duration: 10.8s; animation-delay: 1.0s; }
        .brasa-15 { left: 88%; width: 5px; height: 8px;  animation-duration: 7.2s; animation-delay: 3.8s; }
        .brasa-16 { left: 93%; width: 7px; height: 11px; animation-duration: 9.0s; animation-delay: 0.8s; }
        .brasa-17 { left: 48%; width: 3px; height: 5px;  animation-duration: 5.8s; animation-delay: 4.3s; }
        .brasa-18 { left: 96%; width: 4px; height: 7px;  animation-duration: 6.6s; animation-delay: 2.7s; }

        /* Estilos dedicados ao reprodutor do Homem */
        .painel-player-homem {
            background: rgba(15, 23, 42, 0.88);
            border: 1.5px solid #334155;
            border-radius: 16px;
            padding: 10px 14px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .btn-ctrl-homem {
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .btn-ctrl-homem:active {
            transform: scale(0.92);
        }
        .btn-ctrl-homem.ativo {
            background: #ea580c;
            border-color: #f97316;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- CAMADA 0: VÍDEO 1080P EM TELA CHEIA (CONGELA NO ÚLTIMO FRAME) -->
    <div id="container-video-fundo">
        <video id="video-cenario-fundo" muted autoplay playsinline webkit-playsinline preload="auto">

    <main class="container-homem">
        <!-- REPRODUTOR DINÂMICO CONECTADO AO LISTA-MUSICAS.JS -->
        <div class="painel-player-homem">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px;">
                <div style="min-width: 0; flex: 1;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-size: 13px;">🎵</span>
                        <strong id="player-homem-titulo" style="font-size: 12.5px; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">
                            Carregando faixas...
                        </strong>
                    </div>
                    <span id="player-homem-compositor" style="font-size: 11px; color: #fb923c; font-weight: 700; margin-left: 20px; display: block;">

                    </span>
                </div>

                <!-- Botão de Coração (Favoritar Música) -->
                <button type="button" id="btn-player-favoritar" onclick="window.PlayerHomem.alternarFavorito()" 
                        style="background: none; border: none; cursor: pointer; font-size: 20px; padding: 4px; line-height: 1; flex-shrink: 0;" title="Favoritar Música">
                    🤍

                <button type="button" id="btn-player-abrir-gaveta" onclick="window.PlayerHomem.alternarPainelFavoritas()"

                </button>

                <button type="button" id="btn-player-toggle" class="btn-ctrl-homem" style="width: 38px; height: 38px; font-size: 16px; background: #ea580c; border-color: #f97316;" onclick="window.PlayerHomem.alternarPlay()" title="Reproduzir / Pausar">
                    ▶
                </button>

                <!-- Avançar -->
                <button type="button" id="btn-player-avancar" class="btn-ctrl-homem" onclick="window.PlayerHomem.avancar()" title="Próxima Música">
                    ⏭
                </button>
            </div>

            <!-- Gaveta Retrátil de Músicas Favoritas com Reprodução Exclusiva -->
            <div id="gaveta-player-favoritas" class="oculto" style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed #334155;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 11.5px; font-weight: 800; color: #fbbf24;">Músicas com Coração</span>
                    <button type="button" id="btn-player-tocar-so-favoritas" onclick="window.PlayerHomem.tocarApenasFavoritas()" 
                            style="background: #10b981; color: #ffffff; border: none; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer;">
                        ▶ Tocar Favoritas
                    </button>
                </div>
                <div id="lista-player-favoritas-itens" style="display: flex; flex-direction: column; gap: 5px; max-height: 160px; overflow-y: auto;">

        <section id="secao-espaco-masculino"></section>

    <div id="toast-container"></div>

    <!-- SCRIPTS MODULARES: LISTA DE MÚSICAS EXTERNA E MOTORES -->
    <script src="lista-musicas.js"></script>
    <script src="app-core.js"></script>
    <script src="app-dicas-masculinas.js"></script>
    <script src="app-espaco-masculino.js"></script>

    <!-- MOTOR DO PLAYER HOMEM (LÊ DIRETAMENTE DO LISTA-MUSICAS.JS COM ZERO TRAVAMENTOS) -->
    <script>
        window.PlayerHomem = {
            audio: null,
            pastaSong: 'song/',
            indiceAtual: 0,
            modoAleatorio: localStorage.getItem('suiri_homem_aleatorio') !== 'false',
            soFavoritas: false,
            deveTocarSalvo: localStorage.getItem('suiri_homem_deve_tocar') === 'true',
            favoritas: JSON.parse(localStorage.getItem('suiri_homem_musicas_favoritas') || '[]'),

            obterCatalogo: function() {
                if (Array.isArray(window.CatalogoMusicasFelipeSales) && window.CatalogoMusicasFelipeSales.length > 0) {
                    return window.CatalogoMusicasFelipeSales;
                }
                return [{ arquivo: "1.mp3", titulo: "Música 1" }];
            },

            iniciar: function() {
                const catalogo = this.obterCatalogo();

                if (!this.audio) {
                    this.audio = new Audio();
                    this.audio.preload = 'auto';

                    this.audio.addEventListener('ended', () => {
                        this.avancar(true);
                    });

                    this.audio.addEventListener('play', () => {
                        localStorage.setItem('suiri_homem_deve_tocar', 'true');
                        this.atualizarInterface();
                    });

                    this.audio.addEventListener('pause', () => {
                        localStorage.setItem('suiri_homem_deve_tocar', 'false');
                        this.atualizarInterface();
                    });

                    this.audio.addEventListener('error', () => {
                        // Se houver qualquer falha física no arquivo, avança suavemente para a próxima faixa válida
                        this.avancar(this.deveTocarSalvo);
                    });
                }

                // Resgata o último índice salvo na memória
                const ultimoIdx = parseInt(localStorage.getItem('suiri_homem_idx_atual') || '0', 10);
                this.indiceAtual = (ultimoIdx >= 0 && ultimoIdx < catalogo.length) ? ultimoIdx : 0;

                this.carregarPorIndice(this.indiceAtual, false);
                this.atualizarInterface();
                this.renderizarListaFavoritas();

                // Retoma caso a última sessão tenha sido deixada tocando
                if (this.deveTocarSalvo) {
                    const promessa = this.audio.play();
                    if (promessa !== undefined) {
                        promessa.catch(() => {
                            const retomarAposInteracao = () => {
                                if (this.deveTocarSalvo && this.audio && this.audio.paused) {
                                    this.audio.play().catch(() => {});
                                }
                                document.removeEventListener('click', retomarAposInteracao);
                                document.removeEventListener('touchstart', retomarAposInteracao);
                            };
                            document.addEventListener('click', retomarAposInteracao, { once: true });
                            document.addEventListener('touchstart', retomarAposInteracao, { once: true });
                        });
                    }
                }
            },

            carregarPorIndice: function(indice, reproduzir = true) {
                const catalogo = this.obterCatalogo();
                if (indice < 0 || indice >= catalogo.length) {
                    indice = 0;
                }
                this.indiceAtual = indice;
                localStorage.setItem('suiri_homem_idx_atual', indice.toString());

                const item = catalogo[indice];
                if (!this.audio) this.audio = new Audio();
                
                this.audio.src = `${this.pastaSong}${item.arquivo}`;
                this.atualizarInterface();

                if (reproduzir) {
                    this.audio.play().catch(() => {});
                }
            },

            alternarPlay: function() {
                if (!this.audio) return;
                if (this.audio.paused) {
                    this.audio.play().catch(() => {});
                } else {
                    this.audio.pause();
                }
            },

            alternarAleatorio: function() {
                this.modoAleatorio = !this.modoAleatorio;
                localStorage.setItem('suiri_homem_aleatorio', this.modoAleatorio ? 'true' : 'false');
                this.atualizarInterface();
                if (typeof window.mostrarToast === 'function') {
                    window.mostrarToast(this.modoAleatorio ? "Modo Aleatório Ativado 🔀" : "Modo Sequencial Ativado 🔁", "info");
                }
            },

            obterProximoIndiceAleatorio: function(ignorarAtual = true) {
                const catalogo = this.obterCatalogo();
                let listaIndices = [];

                if (this.soFavoritas && this.favoritas.length > 0) {
                    listaIndices = this.favoritas
                        .map(arq => catalogo.findIndex(item => item.arquivo === arq))
                        .filter(idx => idx !== -1);
                } else {
                    listaIndices = catalogo.map((_, i) => i);
                }

                if (listaIndices.length === 0) return 0;
                if (listaIndices.length === 1) return listaIndices[0];

                let candidatos = ignorarAtual ? listaIndices.filter(i => i !== this.indiceAtual) : listaIndices;
                if (candidatos.length === 0) candidatos = listaIndices;

                const sorteado = Math.floor(Math.random() * candidatos.length);
                return candidatos[sorteado];
            },

            avancar: function(automatico = false) {
                const catalogo = this.obterCatalogo();

                if (this.soFavoritas && this.favoritas.length > 0) {
                    const indicesFavs = this.favoritas
                        .map(arq => catalogo.findIndex(item => item.arquivo === arq))
                        .filter(idx => idx !== -1);

                    if (indicesFavs.length > 0) {
                        if (this.modoAleatorio) {
                            this.carregarPorIndice(this.obterProximoIndiceAleatorio(true), true);
                        } else {
                            const pos = indicesFavs.indexOf(this.indiceAtual);
                            const proxPos = (pos === -1 || pos + 1 >= indicesFavs.length) ? 0 : pos + 1;
                            this.carregarPorIndice(indicesFavs[proxPos], true);
                        }
                        return;
                    }
                }

                if (this.modoAleatorio) {
                    this.carregarPorIndice(this.obterProximoIndiceAleatorio(true), true);
                } else {
                    let proximo = this.indiceAtual + 1;
                    if (proximo >= catalogo.length) proximo = 0;
                    this.carregarPorIndice(proximo, true);
                }
            },

            retroceder: function() {
                const catalogo = this.obterCatalogo();

                if (this.soFavoritas && this.favoritas.length > 0) {
                    const indicesFavs = this.favoritas
                        .map(arq => catalogo.findIndex(item => item.arquivo === arq))
                        .filter(idx => idx !== -1);

                    if (indicesFavs.length > 0) {
                        const pos = indicesFavs.indexOf(this.indiceAtual);
                        const antPos = (pos <= 0) ? indicesFavs.length - 1 : pos - 1;
                        this.carregarPorIndice(indicesFavs[antPos], true);
                        return;
                    }
                }

                let anterior = this.indiceAtual - 1;
                if (anterior < 0) anterior = catalogo.length - 1;
                this.carregarPorIndice(anterior, true);
            },

            alternarFavorito: function() {
                const catalogo = this.obterCatalogo();
                const item = catalogo[this.indiceAtual];
                if (!item) return;

                const idx = this.favoritas.indexOf(item.arquivo);
                if (idx >= 0) {
                    this.favoritas.splice(idx, 1);
                    if (typeof window.mostrarToast === 'function') {
                        window.mostrarToast(`"${item.titulo}" removida das favoritas.`, "info");
                    }
                } else {
                    this.favoritas.push(item.arquivo);
                    if (typeof window.mostrarToast === 'function') {
                        window.mostrarToast(`"${item.titulo}" favoritada! ❤️`, "sucesso");
                    }
                }

                localStorage.setItem('suiri_homem_musicas_favoritas', JSON.stringify(this.favoritas));
                this.atualizarInterface();
                this.renderizarListaFavoritas();
            },

            alternarPainelFavoritas: function() {
                const gaveta = document.getElementById('gaveta-player-favoritas');
                if (gaveta) gaveta.classList.toggle('oculto');
            },

            tocarApenasFavoritas: function() {
                if (this.favoritas.length === 0) {
                    if (typeof window.mostrarToast === 'function') {
                        window.mostrarToast("Nenhuma música favoritada ainda. Toque no coração 🤍 para favoritar!", "erro");
                    }
                    return;
                }

                this.soFavoritas = true;
                const catalogo = this.obterCatalogo();
                const itemAtual = catalogo[this.indiceAtual];

                if (!itemAtual || !this.favoritas.includes(itemAtual.arquivo)) {
                    const primeiroFavIdx = catalogo.findIndex(m => m.arquivo === this.favoritas[0]);
                    this.carregarPorIndice(primeiroFavIdx >= 0 ? primeiroFavIdx : 0, true);
                } else if (this.audio.paused) {
                    this.audio.play().catch(() => {});
                }

                this.atualizarInterface();
                if (typeof window.mostrarToast === 'function') {
                    window.mostrarToast("Reproduzindo apenas músicas favoritas! ⭐", "sucesso");
                }
            },

            renderizarListaFavoritas: function() {
                const cont = document.getElementById('lista-player-favoritas-itens');
                const contador = document.getElementById('contador-player-favoritas');
                if (contador) contador.textContent = this.favoritas.length;

                if (!cont) return;

                if (this.favoritas.length === 0) {
                    cont.innerHTML = '<span style="font-size: 11px; color: #94a3b8; text-align: center; display: block; padding: 4px;">Nenhuma faixa favoritada.</span>';
                    return;
                }

                const catalogo = this.obterCatalogo();

                cont.innerHTML = this.favoritas.map(arq => {
                    const item = catalogo.find(m => m.arquivo === arq) || { arquivo: arq, titulo: arq };
                    const idxNoCatalogo = catalogo.findIndex(m => m.arquivo === arq);

                    return `
                        <div style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 6px 10px; border-radius: 8px; border: 1px solid #334155;">
                            <span style="font-size: 11.5px; color: #f8fafc; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%;">
                                ${item.titulo} - Felipe Sales
                            </span>
                            <div style="display: flex; align-items: center; gap: 6px;">
                                <button type="button" onclick="window.PlayerHomem.carregarPorIndice(${idxNoCatalogo}, true)" style="background: #ea580c; border: none; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer;">
                                    ▶ Tocar
                                </button>
                                <button type="button" onclick="window.PlayerHomem.removerFavoritoDireto('${arq}')" style="background: none; border: none; cursor: pointer; color: #ef4444; font-size: 13px; line-height: 1;">
                                    ✖
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            removerFavoritoDireto: function(arq) {
                this.favoritas = this.favoritas.filter(a => a !== arq);
                localStorage.setItem('suiri_homem_musicas_favoritas', JSON.stringify(this.favoritas));
                if (this.soFavoritas && this.favoritas.length === 0) {
                    this.soFavoritas = false;
                }
                this.atualizarInterface();
                this.renderizarListaFavoritas();
            },

            atualizarInterface: function() {
                const catalogo = this.obterCatalogo();
                const item = catalogo[this.indiceAtual] || { titulo: "Sem faixa" };

                const elTitulo = document.getElementById('player-homem-titulo');
                const btnToggle = document.getElementById('btn-player-toggle');
                const btnFav = document.getElementById('btn-player-favoritar');
                const btnAleatorio = document.getElementById('btn-player-aleatorio');
                const btnSoFav = document.getElementById('btn-player-tocar-so-favoritas');

                if (elTitulo) {
                    elTitulo.textContent = `${item.titulo} - Felipe Sales`;
                }

                if (btnToggle && this.audio) {
                    btnToggle.innerHTML = this.audio.paused ? '▶' : '⏸';
                }

                if (btnFav && item.arquivo) {
                    const ehFav = this.favoritas.includes(item.arquivo);
                    btnFav.innerHTML = ehFav ? '❤️' : '🤍';
                }

                if (btnAleatorio) {
                    if (this.modoAleatorio) {
                        btnAleatorio.classList.add('ativo');
                    } else {
                        btnAleatorio.classList.remove('ativo');
                    }
                }

                if (btnSoFav) {
                    if (this.soFavoritas) {
                        btnSoFav.style.background = '#d97706';
                        btnSoFav.textContent = '★ Favoritas Ativas';
                    } else {
                        btnSoFav.style.background = '#10b981';
                        btnSoFav.textContent = '▶ Tocar Favoritas';
                    }
                }
            }
        };
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const vidFundo = document.getElementById('video-cenario-fundo');
            if (vidFundo) {
                vidFundo.muted = true;
                vidFundo.defaultMuted = true;
                vidFundo.setAttribute('muted', '');
                vidFundo.setAttribute('playsinline', '');
                vidFundo.setAttribute('webkit-playsinline', '');

                vidFundo.addEventListener('ended', () => {
                    vidFundo.pause();
                });

                const dispararVideoIos = () => {
                    vidFundo.muted = true;
                    vidFundo.defaultMuted = true;
                    const promessa = vidFundo.play();
                    if (promessa !== undefined) {
                        promessa.catch(() => {
                            vidFundo.load();
                            vidFundo.play().catch(() => {});
                        });
                    }
                };

                vidFundo.load();
                dispararVideoIos();

                document.body.addEventListener('touchstart', () => {
                    if (vidFundo.paused && !vidFundo.ended) {
                        dispararVideoIos();
                    }
                }, { once: true });
            }

            // Inicia o player integrado ao catálogo externo lista-musicas.js
            if (window.PlayerHomem && typeof window.PlayerHomem.iniciar === 'function') {
                window.PlayerHomem.iniciar();
            }

            setTimeout(() => {
                document.body.classList.add('modo-vidro');
            }, 8000);

            const perfilRaw = localStorage.getItem('suiri_perfil_ativo') || localStorage.getItem('suiri_ultimo_perfil');
            let perfil = {};
            try {
                perfil = JSON.parse(perfilRaw || '{}');
            } catch (e) {
                perfil = {};
            }

            if (perfil.sexo && perfil.sexo.toLowerCase() === 'feminino') {
                if (typeof window.mostrarToast === 'function') {
                    window.mostrarToast("Acesso restrito ao Espaço Masculino.", "erro");
                }
                setTimeout(() => {
                    window.location.replace('index.html');
                }, 400);
                return;
            }

            window.fecharEspacoMasculino = function() {
                if (window.PlayerHomem && window.PlayerHomem.audio) {
                    window.PlayerHomem.audio.pause();
                }
                window.location.href = 'index.html';
            };

            if (typeof window.renderizarEsqueletoEspacoMasculino === 'function') {
                window.renderizarEsqueletoEspacoMasculino();
                if (typeof window.renderizarReflexaoEstoica === 'function') window.renderizarReflexaoEstoica(false);
                if (typeof window.renderizarListaFavoritasEstoicas === 'function') window.renderizarListaFavoritasEstoicas();
                if (typeof window.renderizarBotoesForja === 'function') window.renderizarBotoesForja();
                if (typeof window.renderizarHistoricoForja === 'function') window.renderizarHistoricoForja();
                if (typeof window.renderizarHistoricoRadarIntimo === 'function') window.renderizarHistoricoRadarIntimo();
                if (typeof window.atualizarVisualizacaoMidia === 'function') window.atualizarVisualizacaoMidia();
                if (typeof window.renderizarHistoricoAssistidos === 'function') window.renderizarHistoricoAssistidos();
                if (typeof window.renderizarListasMasculinas === 'function') window.renderizarListasMasculinas();

                if (typeof window.carregarDadosNuvemEspacoMasculino === 'function') {
                    try {
                        await window.carregarDadosNuvemEspacoMasculino();
                    } catch (e) {
                        console.warn("Base local ativa para o Espaço Masculino.");
                    }
                }
            }
        });
    </script>
    
    <script>
    window.alternarSecaoRetratil = function(idConteudo, idSeta) {
        const el = document.getElementById(idConteudo);
        const seta = idSeta ? document.getElementById(idSeta) : null;
        if (!el) return;

        const estaOculto = el.classList.contains('oculto');
        if (estaOculto) {
            el.classList.remove('oculto');
            if (seta) seta.style.transform = 'rotate(180deg)';
        } else {
            el.classList.add('oculto');
            if (seta) seta.style.transform = 'rotate(0deg)';
        }
    };
    </script>

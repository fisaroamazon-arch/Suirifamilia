<body>

    <main class="container-homem">
        <!-- REPRODUTOR DINÂMICO CONECTADO AO LISTA-MUSICAS.JS -->
        <div class="painel-player-homem">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px;">
                <div style="min-width: 0; flex: 1;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span style="font-size: 14px;">🎵</span>
                        <strong id="player-homem-titulo" style="font-size: 13px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-weight: 800;">
                            Carregando faixas...
                        </strong>
                    </div>
                    <span id="player-homem-compositor" style="font-size: 11px; color: #16a34a; font-weight: 700; margin-left: 20px; display: block;">
                        Felipe Sales
                    </span>
                </div>

                <!-- Botão de Coração (Favoritar Música) -->
                <button type="button" id="btn-player-favoritar" onclick="window.PlayerHomem.alternarFavorito()" 
                        style="background: none; border: none; cursor: pointer; font-size: 20px; padding: 4px; line-height: 1; flex-shrink: 0;" title="Favoritar Música">
                    🤍
                </button>

                <!-- Botão para Abrir a Gaveta de Músicas Favoritas -->
                <button type="button" id="btn-player-abrir-gaveta" onclick="window.PlayerHomem.alternarPainelFavoritas()" 
                        style="background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
                    ⭐ <span id="contador-player-favoritas">0</span>
                </button>
            </div>

            <!-- Controles do Reprodutor: Aleatório, Retroceder, Pausa/Play, Avançar -->
            <div style="display: flex; justify-content: center; align-items: center; gap: 14px;">
                <!-- Modo Aleatório -->
                <button type="button" id="btn-player-aleatorio" class="btn-ctrl-homem" onclick="window.PlayerHomem.alternarAleatorio()" title="Modo Aleatório (Shuffle)">
                    🔀
                </button>

                <!-- Retroceder -->
                <button type="button" id="btn-player-retroceder" class="btn-ctrl-homem" onclick="window.PlayerHomem.retroceder()" title="Música Anterior">
                    ⏮
                </button>

                <!-- Pausa / Play -->
                <button type="button" id="btn-player-toggle" class="btn-ctrl-homem" style="width: 42px; height: 42px; font-size: 17px; background: #16a34a; border-color: #15803d; color: #ffffff; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);" onclick="window.PlayerHomem.alternarPlay()" title="Reproduzir / Pausar">
                    ▶
                </button>

                <!-- Avançar -->
                <button type="button" id="btn-player-avancar" class="btn-ctrl-homem" onclick="window.PlayerHomem.avancar()" title="Próxima Música">
                    ⏭
                </button>
            </div>

            <!-- Gaveta Retrátil de Músicas Favoritas com Reprodução Exclusiva -->
            <div id="gaveta-player-favoritas" class="oculto" style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed #cbd5e1;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 11.5px; font-weight: 800; color: #d97706;">Músicas Selecionadas</span>
                    <button type="button" id="btn-player-tocar-so-favoritas" onclick="window.PlayerHomem.tocarApenasFavoritas()" 
                            style="background: #16a34a; color: #ffffff; border: none; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer;">
                        ▶ Tocar Favoritas
                    </button>
                </div>
                <div id="lista-player-favoritas-itens" style="display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto;">
                    <!-- Itens renderizados via JavaScript -->
                </div>
            </div>
        </div>

        <section id="secao-espaco-masculino"></section>
    </main>

    <div id="toast-container"></div>

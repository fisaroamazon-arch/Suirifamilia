<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Espaço Arte · Suiri Família</title>
    <link rel="stylesheet" href="styles/pages/arte.css?v=97e3adb261a5">
    <script src="src/data/desenhos-arte.js?v=3ce33393256b" defer></script>
    <script src="src/pages/arte.js?v=326d9a4694c8" defer></script>
</head>
<body>
    <main class="atelier">
        <header class="cabecalho">
            <a href="jogos.html" class="voltar">‹ Arcade</a>
            <h1>Espaço Arte</h1>
            <button type="button" id="abrir-ferramentas" aria-haspopup="dialog"><span class="cor-ativa" aria-hidden="true"></span> Ferramentas</button>
        </header>

        <div class="folha" id="folha">
            <canvas id="papel" width="640" height="640" aria-label="Área de desenho. Use o dedo ou o mouse para desenhar."></canvas>
        </div>
        <p id="arte-aviso" class="somente-leitor" role="status"></p>

        <dialog id="ferramentas-arte" aria-labelledby="titulo-ferramentas-arte">
            <header class="cabecalho-ferramentas">
                <h2 id="titulo-ferramentas-arte">Ferramentas</h2>
                <button type="button" id="fechar-ferramentas" aria-label="Voltar para a folha">Concluir</button>
            </header>
            <section class="ferramentas" aria-label="Ferramentas de desenho">
                <div class="linha">
                    <div class="pinceis" role="group" aria-label="Tipo de pincel">
                        <button type="button" data-pincel="pincel" aria-pressed="true">Pincel</button>
                        <button type="button" data-pincel="giz" aria-pressed="false">Giz de cera</button>
                        <button type="button" data-pincel="cerdas" aria-pressed="false">Cerdas</button>
                        <button type="button" data-pincel="marca" aria-pressed="false">Marcador</button>
                        <button type="button" data-pincel="spray" aria-pressed="false">Spray</button>
                        <button type="button" data-pincel="borracha" aria-pressed="false">Borracha</button>
                    </div>
                    <label class="espessura">
                        Espessura
                        <input id="espessura" type="range" min="2" max="64" value="14">
                        <span class="previa-pincel" aria-hidden="true"><i></i></span>
                    </label>
                </div>
                <div class="paleta" role="group" aria-label="Paleta de cores">
                    <button type="button" aria-label="Roxo" data-cor="#7847c9" style="--cor:#7847c9" aria-pressed="true"></button>
                    <button type="button" aria-label="Rosa" data-cor="#e45085" style="--cor:#e45085" aria-pressed="false"></button>
                    <button type="button" aria-label="Vermelho" data-cor="#df4545" style="--cor:#df4545" aria-pressed="false"></button>
                    <button type="button" aria-label="Laranja" data-cor="#f18839" style="--cor:#f18839" aria-pressed="false"></button>
                    <button type="button" aria-label="Amarelo" data-cor="#f3d14d" style="--cor:#f3d14d" aria-pressed="false"></button>
                    <button type="button" aria-label="Verde" data-cor="#45af79" style="--cor:#45af79" aria-pressed="false"></button>
                    <button type="button" aria-label="Azul" data-cor="#3899ed" style="--cor:#3899ed" aria-pressed="false"></button>
                    <button type="button" aria-label="Preto" data-cor="#252030" style="--cor:#252030" aria-pressed="false"></button>
                    <label class="personalizada" title="Escolher outra cor">
                        <span aria-hidden="true">+</span>
                        <input id="cor-livre" type="color" value="#7847c9" aria-label="Escolher outra cor">
                    </label>
                </div>
            </section>

            <div class="acoes" role="group" aria-label="Ações do desenho">
                <button id="desfazer" type="button" disabled>↶ Desfazer</button>
                <button id="refazer" type="button" disabled>↷ Refazer</button>
                <button id="folha-nova" type="button">Folha em branco</button>
                <button id="baixar-arte" type="button">Salvar PNG</button>
            </div>

            <button id="tela-cheia-arte" type="button" hidden>Entrar em tela cheia</button>
            <section class="caderno" aria-labelledby="titulo-caderno">
            <header>
                <h2 id="titulo-caderno">Caderno de colorir</h2>
                <div class="importar-arte">
                    <label class="importar">Usar imagem<input id="imagem-arte" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="somente-leitor"></label>
                    <label class="importar">Foto em contorno<input id="foto-contorno-arte" type="file" accept="image/png,image/jpeg,image/webp,image/gif" class="somente-leitor"></label>
                </div>
            </header>
                <div class="niveis-caderno" role="group" aria-label="Dificuldade dos desenhos">
                    <button type="button" data-arte-nivel="facil" aria-pressed="true">Fácil</button>
                    <button type="button" data-arte-nivel="medio" aria-pressed="false">Médio</button>
                    <button type="button" data-arte-nivel="avancado" aria-pressed="false">Avançado</button>
                </div>
                <div class="paginas" id="paginas"></div>
            </section>
        </dialog>
    </main>
</body>
</html>

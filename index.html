<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suiri Gestão Familiar</title>
    
    <!-- Configurações PWA e Metadados Mobile -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d97706">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Suiri">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23d97706'%3E%3Crect width='512' height='512' rx='120' fill='%23d97706'/%3E%3Cpath d='M256 120 L380 230 L340 230 L340 380 L172 380 L172 230 L132 230 Z' fill='%23FFFFFF'/%3E%3Ccircle cx='256' cy='300' r='35' fill='%23d97706'/%3E%3C/svg%3E">

    <!-- Folhas de Estilo Modulares -->
    <link rel="stylesheet" href="css-base.css">
    <link rel="stylesheet" href="css-modulos.css">
    <link rel="stylesheet" href="css-modais.css">

    <!-- Dependências Externas: Supabase, Chart.js e Exportação PDF -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Regras Críticas de Resguardo para o Splash Screen e Banner PWA -->
    <style>
        .oculto {
            display: none !important;
        }

        #splash-screen-apresentacao {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: #000000 !important;
            z-index: 99999999 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash-screen-apresentacao.fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        #video-intro-splash {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }

        /* Banner Flutuante de Instalação PWA */
        #banner-instalacao-pwa {
            position: fixed;
            bottom: 64px;
            left: 12px;
            right: 12px;
            background: var(--pastel-card, #ffffff);
            border: 1.5px solid var(--borda-delicada, rgba(217, 119, 6, 0.25));
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            animation: slideUpPwa 0.35s ease-out;
        }

        @keyframes slideUpPwa {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- =================================================================== -->
    <!-- TELA DE SPLASH COM VÍDEO (Compatível com iPhone / Safari WebKit)     -->
    <!-- =================================================================== -->
    <div id="splash-screen-apresentacao" class="oculto">
        <video id="video-intro-splash" muted autoplay playsinline webkit-playsinline preload="auto">
            <source src="intro.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Container Centralizado de Notificações (Toasts) -->
    <div id="toast-container"></div>

    <!-- Banner Flutuante Convidando a Instalar o AppWeb -->
    <div id="banner-instalacao-pwa" class="oculto">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
            <div style="width: 38px; height: 38px; border-radius: 10px; background: var(--cor-primaria, #d97706); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff;">
                <svg class="icone-svg" style="width: 22px; height: 22px;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </div>
            <div style="min-width: 0;">
                <strong style="font-size: 13px; color: var(--texto-principal, #334155); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Instalar o Suiri</strong>
                <span id="txt-instrucao-pwa" style="font-size: 11px; color: var(--texto-suave, #64748b); display: block;">Acesso rápido na tela inicial</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
            <button type="button" class="btn-secundario" style="padding: 6px 10px; font-size: 11px; border-radius: 8px;" onclick="window.fecharBannerPwa()">Agora não</button>
            <button type="button" id="btn-instalar-pwa-acao" class="btn-principal" style="padding: 6px 12px; font-size: 11px; font-weight: 700; border-radius: 8px;" onclick="window.executarInstalacaoPwa()">Instalar</button>
        </div>
    </div>

    <!-- Barra de Navegação Superior Fixa -->
    <nav class="bottom-nav oculto" id="barra-navegacao-principal">
        <ul class="bottom-nav-list">
            <li class="bottom-nav-item ativo" data-tela="inicio" onclick="window.navegarParaTela('inicio')">
                <svg class="icone-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                <span id="nav-item-lbl-missoes">Missões</span>
            </li>
            <li class="bottom-nav-item" data-tela="mercado" onclick="window.navegarParaTela('mercado')">
                <svg class="icone-svg" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                <span>Mercado</span>
            </li>
            <li class="bottom-nav-item" data-tela="financeiro" onclick="window.navegarParaTela('financeiro')">
                <svg class="icone-svg" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                <span>Finanças</span>
            </li>
            <li class="bottom-nav-item" data-tela="calendario" onclick="window.navegarParaTela('calendario')">
                <svg class="icone-svg" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                <span>Agenda</span>
            </li>
            <li class="bottom-nav-item" data-tela="familia" onclick="window.navegarParaTela('familia')">
                <svg class="icone-svg" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span id="nav-item-lbl-familia">Família</span>
            </li>
        </ul>
    </nav>

    <main class="container">

        <!-- =================================================================== -->
        <!-- TELA 0: AUTENTICAÇÃO REAL (LOGIN OU CADASTRO DA FAMÍLIA)             -->
        <!-- =================================================================== -->
        <section id="tela-login" class="secao-conteudo-app">
            <div class="cartao-geral" style="text-align: center; margin-top: 15px; padding: 24px 18px;">
                <div style="margin-bottom: 20px;">
                    <h1 style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px; color: var(--cor-primaria, #d97706); text-transform: uppercase; margin: 0;">
                        Suiri
                    </h1>
                    <span id="lbl-subtitulo-login" style="font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--texto-suave, #64748b); text-transform: uppercase; display: block; margin-top: 2px;">
                        Gestão Familiar
                    </span>
                </div>

                <div style="display: flex; gap: 8px; margin-bottom: 18px;">
                    <button type="button" class="btn-principal" style="flex:1;" onclick="window.alternarAbaLoginCadastro('login')">Entrar</button>
                    <button type="button" class="btn-secundario" style="flex:1;" onclick="window.alternarAbaLoginCadastro('cadastro')">Criar Lar</button>
                </div>

                <div id="bloco-form-login" style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="email" id="login-email" placeholder="Seu e-mail cadastrado">
                    <input type="password" id="login-senha" placeholder="Sua senha de acesso">
                    <button type="button" class="btn-principal" onclick="window.fazerLoginEmail(document.getElementById('login-email').value, document.getElementById('login-senha').value)">
                        Acessar o Lar
                    </button>
                </div>

                <div id="bloco-form-cadastro" class="oculto" style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" id="cad-nome-familia" placeholder="Nome da Família ou Seu Espaço (ex: Meu Lar)">
                    <input type="text" id="cad-nome-adm" placeholder="Seu Nome Completo">
                    <input type="email" id="cad-email-adm" placeholder="Seu E-mail principal">
                    <input type="text" id="cad-cpf-adm" placeholder="Seu CPF (apenas números)" maxlength="14" oninput="this.value = window.formatarCPF(this.value)">
                    <input type="password" id="cad-senha-adm" placeholder="Crie uma Senha (mín. 6 dígitos)">
                    <button type="button" class="btn-sucesso" onclick="window.cadastrarNovaFamiliaADM({
                        nomeFamilia: document.getElementById('cad-nome-familia').value,
                        nomeAdm: document.getElementById('cad-nome-adm').value,
                        emailAdm: document.getElementById('cad-email-adm').value,
                        cpfAdm: document.getElementById('cad-cpf-adm').value,
                        senha: document.getElementById('cad-senha-adm').value
                    })">
                        Confirmar
                    </button>
                </div>
            </div>
        </section>

        <!-- =================================================================== -->
        <!-- APLICAÇÃO PRINCIPAL LOGADA                                          -->
        <!-- =================================================================== -->
        <div id="tela-app" class="oculto">

            <!-- =============================================================== -->
            <!-- MODO KIDS EXCLUSIVO                                             -->
            <!-- =============================================================== -->
            <section id="tela-kids-exclusiva" class="oculto">
                <div class="cabecalho-kids-container">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <img id="img-avatar-kids" class="avatar-kids-circulo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d97706' stroke-width='2'%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/%3E%3Ccircle cx='12' cy='7' r='4'/%3E%3C/svg%3E" alt="Avatar Kids" onclick="window.abrirSeletorFotoPerfil()" title="Mudar Foto">
                        <div>
                            <span class="subtitulo-kids-tag">Minhas Conquistas</span>
                            <h2 id="nome-membro-kids" class="titulo-kids-nome">Criança</h2>
                        </div>
                    </div>

                    <div style="display:flex; align-items:center; gap:8px;">
                        <div class="badge-xp-kids-topo">
                            <svg class="icone-svg" style="width:18px; height:18px; color:#f59e0b;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>
                            <span id="contador-xp-kids">0 XP</span>
                        </div>

                        <button type="button" class="btn-circular-trocar-membro" onclick="window.abrirJanelaPrincipalQuiosque()" title="Trocar Membro">
                            <svg class="icone-svg" style="width: 18px; height: 18px;" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </button>
                    </div>
                </div>

                <button type="button" class="btn-lojinha-kids-gigante" onclick="window.abrirModalRankingEquipe()">
                    <div class="icone-box-presente">
                        <svg class="icone-svg" style="width:32px; height:32px; color:#ffffff;" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
                    </div>
                    <div style="text-align:left;">
                        <span style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; opacity:0.9; display:block;">Recompensas</span>
                        <strong style="font-size:17px; font-weight:800; display:block;">Abrir a Lojinha de Prêmios</strong>
                    </div>
                </button>

                <div style="display:flex; justify-content:space-between; align-items:center; margin:14px 4px 10px 4px;">
                    <h3 style="font-size:16px; font-weight:800; color:#1e293b; display:flex; align-items:center; gap:6px;">
                        <svg class="icone-svg" style="color:#10b981; width:20px; height:20px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                        Tarefas para Fazer Hoje
                    </h3>
                    <span id="contador-missoes-kids-pendentes" class="badge-contador-kids">0 missões</span>
                </div>

                <div id="lista-missoes-kids-container"></div>
            </section>

            <!-- =============================================================== -->
            <!-- AMBIENTE DE ADULTOS                                             -->
            <!-- =============================================================== -->
            <div id="painel-adulto-container">
                <header class="cabecalho-app" id="cabecalho-topo-usuario" style="display:flex; justify-content:space-between; align-items:center; padding:12px 14px; gap:8px;">
                    <div style="display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1;">
                        <input type="file" id="input-upload-avatar-membro" accept="image/*" class="oculto" onchange="window.processarUploadAvatar(event)">
                        <div style="position: relative;" onclick="window.abrirSeletorFotoPerfil()">
                            <img id="img-avatar-topo" class="avatar-topo-usuario" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d97706' stroke-width='2'%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/%3E%3Ccircle cx='12' cy='7' r='4'/%3E%3C/svg%3E" alt="Avatar">
                        </div>
                        <div style="min-width: 0;">
                            <span id="nome-familia-topo" style="font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--texto-suave, #64748b); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Suiri Gestão Familiar</span>
                            <h3 id="nome-membro-topo" style="font-size: 14.5px; margin: 0; color: var(--texto-principal, #334155); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Familiar</h3>
                        </div>

                        <button type="button" id="btn-trocar-membro-topo" class="btn-circular-trocar-membro" onclick="window.abrirJanelaPrincipalQuiosque()" title="Trocar Membro">
                            <svg class="icone-svg" style="width: 17px; height: 17px;" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </button>
                    </div>

                    <div style="display: grid; grid-template-columns: auto auto; gap: 5px; flex-shrink: 0;">
                        <button type="button" class="btn-secundario" style="padding: 4px 8px; font-size: 11px; font-weight: 700; border-radius: 8px;" onclick="window.abrirModalPilulaDia()">
                            Pense
                        </button>
                        <a href="javascript:void(0)" class="btn-loja-topo" style="padding: 4px 8px; font-size: 11px; border-radius: 8px;" onclick="window.abrirModalRankingEquipe()">
                            <svg class="icone-svg icone-fogo" style="width: 12px; height: 12px;" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                            <span id="contador-ofensiva-topo">0</span>d • Loja
                        </a>

                        <button type="button" class="btn-secundario" style="padding: 4px 8px; font-size: 11px; font-weight: 700; border-radius: 8px;" onclick="window.iniciarTourInstrucoes()">
                            Manual
                        </button>
                        <button type="button" id="btn-sair-topo-app" class="btn-erro" style="padding: 4px 8px; font-size: 11px; font-weight: 700; border-radius: 8px;" onclick="window.fazerLogoff()">
                            Sair
                        </button>
                    </div>
                </header>

                <!-- BOTÃO LONGO DE DESTAQUE: APOIAR O PROJETO -->
                <button type="button" class="btn-barra-apoiar-projeto" onclick="window.abrirModalApoioPix()" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 12px; margin-bottom: 12px; background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 1.5px solid #f59e0b; border-radius: 12px; color: #b45309; font-size: 12.5px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.15); transition: transform 0.15s ease, background 0.2s ease;">
                    <svg class="icone-svg" style="width: 15px; height: 15px; color: #d97706;" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></s

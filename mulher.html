    <main class="container-mulher">
        <!-- BARRA SUPERIOR: BOTÃO '← Voltar' E PLAYER AMPLIADO COM LETREIRO EM CICLO -->
        <div id="barra-topo-player-mulher" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:6px; flex-wrap:nowrap; width:100%;">
            <!-- BOTÃO COMPACTO "← Voltar" -->
            <button type="button" onclick="window.fecharEspacoMulher()" 
                    style="flex-shrink:0; display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border-radius:18px; font-size:11px; font-weight:800; background:rgba(255, 255, 255, 0.90); border:1.5px solid var(--borda-fem, #e9d5ff); color:#581c87; box-shadow:0 3px 10px rgba(124, 58, 237, 0.10); backdrop-filter:blur(8px); cursor:pointer; white-space:nowrap; line-height:1; transition:all 0.2s ease;">
                <span style="font-size:12px; line-height:1; color:#7c3aed;">←</span>
                <span>Voltar</span>
            </button>

            <!-- MINI PLAYER DE ÁUDIO COM LETREIRO AMPLIADO EM CICLO -->
            <div id="mini-player-espaco-mulher" style="flex:1 1 auto; max-width:calc(100% - 75px); display:inline-flex; align-items:center; justify-content:space-between; gap:3px; padding:4px 7px; background:rgba(255, 255, 255, 0.92); border:1.5px solid #e9d5ff; border-radius:20px; box-shadow:0 3px 12px rgba(124, 58, 237, 0.12); backdrop-filter:blur(8px);">
                <!-- TÍTULO DA MÚSICA E AUTOR EM CICLO CONTÍNUO (LETREIRO MARQUEE) -->
                <div class="marquee-box-mulher" title="Música em reprodução">
                    <div class="marquee-track-mulher" id="marquee-player-mulher-track">
                        <span id="player-mulher-faixa-lbl-1">Carregando... - Filipe Sales</span>
                        <span id="player-mulher-faixa-lbl-2">Carregando... - Filipe Sales</span>
                    </div>
                </div>

                <!-- CONTROLES DO REPRODUTOR -->
                <div style="display:inline-flex; align-items:center; gap:3px; flex-shrink:0;">
                    <!-- Botão Shuffle / Aleatório -->
                    <button type="button" id="btn-player-mulher-shuffle" onclick="window.PlayerMulher.alternarAleatorio()" 
                            style="background:#f3e8ff; border:1px solid #d8b4fe; color:#581c87; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:9.5px; cursor:pointer; padding:0;" title="Modo Aleatório (Ligado/Desligado)">
                        🔀
                    </button>

                    <!-- Botão Faixa Anterior -->
                    <button type="button" id="btn-player-mulher-prev" onclick="window.PlayerMulher.anterior()" 
                            style="background:#f3e8ff; border:1px solid #d8b4fe; color:#581c87; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:9.5px; cursor:pointer; padding:0;" title="Música Anterior">
                        ⏮
                    </button>
                    
                    <!-- Botão Play / Pausa -->
                    <button type="button" id="btn-player-mulher-toggle" onclick="window.PlayerMulher.alternarPausa()" 
                            style="background:#7c3aed; border:1px solid #6d28d9; color:#ffffff; border-radius:50%; width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; font-size:10px; cursor:pointer; padding:0; box-shadow:0 2px 5px rgba(124, 58, 237, 0.3);" title="Reproduzir / Pausar">
                        ▶
                    </button>

                    <!-- Botão Próxima Faixa -->
                    <button type="button" id="btn-player-mulher-next" onclick="window.PlayerMulher.proxima()" 
                            style="background:#f3e8ff; border:1px solid #d8b4fe; color:#581c87; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:9.5px; cursor:pointer; padding:0;" title="Próxima Música">
                        ⏭
                    </button>

                    <!-- Botão Favoritar Coração -->
                    <button type="button" id="btn-player-mulher-coracao" onclick="window.PlayerMulher.alternarFavorito()" 
                            style="background:transparent; border:none; color:#db2777; font-size:12px; cursor:pointer; padding:0 1px; line-height:1;" title="Favoritar Música">
                        🤍
                    </button>

                    <!-- Botão Gaveta Favoritas -->
                    <button type="button" id="btn-player-mulher-gaveta" onclick="window.PlayerMulher.alternarGavetaFavoritas()" 
                            style="background:#fce7f3; border:1px solid #fbcfe8; color:#be185d; border-radius:10px; padding:2px 4px; font-size:8.5px; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; gap:1px;" title="Ver Músicas Favoritas">
                        ❤️ <span id="contador-favoritas-mulher">0</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- PAINEL RETRÁTIL DE MÚSICAS FAVORITAS DO ESPAÇO MULHER -->
        <div id="gaveta-favoritas-mulher" class="oculto cartao-geral" style="margin-bottom:14px; padding:12px 14px; border:1.5px solid #fbcfe8; background:rgba(255, 255, 255, 0.92); border-radius:18px; box-shadow:0 4px 16px rgba(219, 39, 119, 0.12);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px dashed #fbcfe8; padding-bottom:6px;">
                <span style="font-size:11.5px; font-weight:800; color:#9d174d; display:flex; align-items:center; gap:4px;">
                    ❤️ Minhas Faixas Favoritas
                </span>
                <div style="display:flex; gap:6px;">
                    <button type="button" id="btn-tocar-so-favoritas-mulher" onclick="window.PlayerMulher.tocarSoFavoritas()" 
                            style="background:#db2777; border:none; color:#fff; border-radius:10px; padding:4px 10px; font-size:10px; font-weight:800; cursor:pointer; box-shadow:0 2px 6px rgba(219, 39, 119, 0.25);">
                        ▶ Tocar Só Favoritas
                    </button>
                    <button type="button" onclick="window.PlayerMulher.alternarGavetaFavoritas()" 
                            style="background:#f3e8ff; border:1px solid #d8b4fe; color:#581c87; border-radius:8px; padding:3px 8px; font-size:10px; font-weight:800; cursor:pointer;">
                        ✕
                    </button>
                </div>
            </div>
            <div id="lista-favoritas-mulher-conteudo" style="display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto;">
                <span style="font-size:11px; color:#9d174d; text-align:center; display:block; padding:8px;">Nenhuma música favoritada ainda. Toque no coração 🤍 para guardar.</span>
            </div>
        </div>

        <section id="secao-espaco-mulher"></section>
    </main>

    <div id="toast-container"></div>

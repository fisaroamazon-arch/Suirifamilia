<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suiri - Espaço Mulher</title>

    <!-- Configurações e Cores do Espaço Mulher Sóbrio -->
    <meta name="theme-color" content="#581c87">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icone.jpg">

    <!-- Tipografia e Estilos Dedicados -->
    <link rel="stylesheet" href="css-base.css">
    <link rel="stylesheet" href="css-modulos.css">
    <link rel="stylesheet" href="css-modais.css">

    <!-- Dependências Externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            /* Paleta Mulher Madura & Sóbria: Ameixa, Lavanda & Figo */
            --cor-primaria-fem: #7c3aed;
            --cor-secundaria-fem: #581c87;
            --texto-titulo-fem: #3b0764;
            --bg-delicado-fem: #ffffff;
            --borda-fem: #e9d5ff;
        }

        /* =========================================================================
           CAMADA 0: VÍDEO DE FUNDO 1080p ADAPTATIVO TELA CHEIA (SEM ESTOURAR)
           ========================================================================= */
        #container-video-fundo {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            overflow: hidden !important;
            z-index: 0 !important;
            pointer-events: none !important;
            margin: 0 !important;
            padding: 0 !important;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }

        #video-cenario-fundo {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: cover !important;
            object-position: center center !important;
            pointer-events: none !important;
            filter: contrast(115%) saturate(145%) brightness(105%);
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }

        #container-video-fundo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: transparent !important;
            pointer-events: none;
        }

        body {
            background: transparent !important;
            min-height: 100vh;
            padding: 14px 10px 40px 10px;
            color: #1e1b4b;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .container-mulher {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .oculto {
            display: none !important;
        }

        .bottom-nav-fixa-inferior, .bottom-nav {
            display: none !important;
        }

        /* =========================================================================
           TRANSPARÊNCIA TOTAL DOS QUADROS E TRANSIÇÃO GRADUAL PARA VIDRO
           ========================================================================= */
        /* Estado 1 (Primeiros 4 segundos): Transparência completa para ver o vídeo */
        .cartao-geral {
            background: transparent !important;
            border: 1.5px solid rgba(233, 213, 255, 0.5) !important;
            backdrop-filter: blur(0px) !important;
            -webkit-backdrop-filter: blur(0px) !important;
            box-shadow: none !important;
            border-radius: 20px !important;
            transition: background 2.5s ease, backdrop-filter 2.5s ease, -webkit-backdrop-filter 2.5s ease, box-shadow 2.5s ease, border-color 2.5s ease !important;
        }

        .cartao-geral div[style*="background"],
        .cartao-geral input[type="text"],
        .cartao-geral input[type="date"],
        .cartao-geral input[type="number"],
        .cartao-geral textarea,
        .cartao-geral label[style*="background"] {
            background: rgba(255, 255, 255, 0.18) !important;
            border-color: rgba(233, 213, 255, 0.4) !important;
            transition: background 2.5s ease, border-color 2.5s ease !important;
        }

        /* Estado 2 (Após 4 segundos): Transição suave para Vidro Acetinado Feminino */
        body.modo-vidro .cartao-geral {
            background: rgba(255, 255, 255, 0.72) !important;
            border: 1px solid rgba(233, 213, 255, 0.65) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.08) !important;
        }

        body.modo-vidro .cartao-geral div[style*="background"],
        body.modo-vidro .cartao-geral label[style*="background"] {
            background: rgba(255, 255, 255, 0.75) !important;
            border-color: rgba(233, 213, 255, 0.75) !important;
        }

        body.modo-vidro .cartao-geral input[type="text"],
        body.modo-vidro .cartao-geral input[type="date"],
        body.modo-vidro .cartao-geral input[type="number"],
        body.modo-vidro .cartao-geral textarea {
            background: rgba(255, 255, 255, 0.65) !important;
            border-color: rgba(233, 213, 255, 0.75) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
        }

        /* Sombras leves nas legendas e textos para nitidez sobre o vídeo */
        .cartao-geral p, .cartao-geral span, .cartao-geral strong, .cartao-geral h2, .cartao-geral h3, .cartao-geral h4 {
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9), 0 0 2px rgba(255, 255, 255, 0.6);
        }

        /* Ampliação de ícones (+20%) */
        img[src*="./icone/"],
        img[src*="icone/"],
        .icone-svg,
        .icone-sistema-img {
            transform: scale(1.2);
            transform-origin: center center;
            display: inline-block;
            vertical-align: middle;
        }

        button img[src*="./icone/"],
        label img[src*="./icone/"],
        span img[src*="./icone/"] {
            margin-left: 2px;
            margin-right: 2px;
        }

        /* =========================================================================
           CAMADA 1: ANIMAÇÃO DE PÉTALAS EXPANDIDA COM CORES VARIADAS (60FPS)
           ========================================================================= */
        #container-petalas-fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .petala-suiri {
            position: absolute;
            bottom: -35px;
            border-radius: 70% 30% 65% 35% / 60% 40% 70% 30%;
            filter: blur(0.4px);
            animation: subirPetala linear infinite;
        }

        /* Variações de Cores Florais */
        .petala-lavanda {
            background: radial-gradient(circle, rgba(192, 132, 252, 0.65) 0%, rgba(168, 85, 247, 0.35) 60%, transparent 100%);
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.35);
        }

        .petala-rosa {
            background: radial-gradient(circle, rgba(244, 114, 182, 0.65) 0%, rgba(236, 72, 153, 0.32) 65%, transparent 100%);
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.35);
        }

        .petala-pessego {
            background: radial-gradient(circle, rgba(251, 146, 60, 0.6) 0%, rgba(244, 114, 182, 0.3) 65%, transparent 100%);
            box-shadow: 0 0 10px rgba(251, 146, 60, 0.3);
        }

        .petala-ameixa {
            background: radial-gradient(circle, rgba(216, 70, 239, 0.65) 0%, rgba(147, 51, 234, 0.35) 70%, transparent 100%);
            box-shadow: 0 0 12px rgba(216, 70, 239, 0.35);
        }

        @keyframes subirPetala {
            0% { 
                transform: translateY(0) rotate(0deg) scale(0.75) translateX(0); 
                opacity: 0; 
            }
            15% { 
                opacity: 0.85; 
            }
            50% { 
                transform: translateY(-50vh) rotate(190deg) scale(1.15) translateX(18px); 
                opacity: 0.75; 
            }
            80% { 
                opacity: 0.6; 
            }
            100% { 
                transform: translateY(-115vh) rotate(390deg) scale(1.3) translateX(-20px); 
                opacity: 0; 
            }
        }

        /* 18 Pétalas com diferentes trajetos, atrasos e posições */
        .petala-1  { left: 3%;  width: 16px; height: 23px; animation-duration: 12.5s; animation-delay: 0s; }
        .petala-2  { left: 9%;  width: 14px; height: 19px; animation-duration: 9.8s;  animation-delay: 1.5s; }
        .petala-3  { left: 16%; width: 20px; height: 28px; animation-duration: 14.0s; animation-delay: 3.2s; }
        .petala-4  { left: 22%; width: 13px; height: 18px; animation-duration: 8.5s;  animation-delay: 0.8s; }
        .petala-5  { left: 28%; width: 22px; height: 30px; animation-duration: 15.5s; animation-delay: 4.5s; }
        .petala-6  { left: 35%; width: 15px; height: 21px; animation-duration: 10.2s; animation-delay: 2.1s; }
        .petala-7  { left: 42%; width: 18px; height: 25px; animation-duration: 13.0s; animation-delay: 5.2s; }
        .petala-8  { left: 48%; width: 14px; height: 20px; animation-duration: 9.2s;  animation-delay: 1.1s; }
        .petala-9  { left: 54%; width: 21px; height: 29px; animation-duration: 14.5s; animation-delay: 3.7s; }
        .petala-10 { left: 61%; width: 16px; height: 22px; animation-duration: 11.0s; animation-delay: 0.4s; }
        .petala-11 { left: 67%; width: 19px; height: 26px; animation-duration: 13.5s; animation-delay: 4.8s; }
        .petala-12 { left: 73%; width: 13px; height: 19px; animation-duration: 8.8s;  animation-delay: 2.5s; }
        .petala-13 { left: 79%; width: 22px; height: 31px; animation-duration: 15.0s; animation-delay: 6.0s; }
        .petala-14 { left: 84%; width: 15px; height: 21px; animation-duration: 10.5s; animation-delay: 1.9s; }
        .petala-15 { left: 89%; width: 18px; height: 24px; animation-duration: 12.0s; animation-delay: 3.9s; }
        .petala-16 { left: 93%; width: 14px; height: 19px; animation-duration: 9.5s;  animation-delay: 0.7s; }
        .petala-17 { left: 50%; width: 17px; height: 23px; animation-duration: 11.5s; animation-delay: 5.7s; }
        .petala-18 { left: 96%; width: 15px; height: 20px; animation-duration: 10.0s; animation-delay: 2.9s; }
    </style>
</head>
<body>

    <!-- CAMADA 0: VÍDEO 1080P EM TELA CHEIA (SEM LOOP - CONGELA NO ÚLTIMO FRAME) -->
    <div id="container-video-fundo">
        <video id="video-cenario-fundo" autoplay muted playsinline webkit-playsinline preload="auto">
            <source src="flores.mp4" type="video/mp4">
        </video>
    </div>

    <!-- CAMADA 1: PÉTALAS FLUTUANTES EM DIVERSAS CORES -->
    <div id="container-petalas-fundo">
        <div class="petala-suiri petala-lavanda petala-1"></div>
        <div class="petala-suiri petala-rosa    petala-2"></div>
        <div class="petala-suiri petala-pessego petala-3"></div>
        <div class="petala-suiri petala-ameixa  petala-4"></div>
        <div class="petala-suiri petala-rosa    petala-5"></div>
        <div class="petala-suiri petala-lavanda petala-6"></div>
        <div class="petala-suiri petala-ameixa  petala-7"></div>
        <div class="petala-suiri petala-pessego petala-8"></div>
        <div class="petala-suiri petala-lavanda petala-9"></div>
        <div class="petala-suiri petala-rosa    petala-10"></div>
        <div class="petala-suiri petala-ameixa  petala-11"></div>
        <div class="petala-suiri petala-pessego petala-12"></div>
        <div class="petala-suiri petala-lavanda petala-13"></div>
        <div class="petala-suiri petala-rosa    petala-14"></div>
        <div class="petala-suiri petala-ameixa  petala-15"></div>
        <div class="petala-suiri petala-pessego petala-16"></div>
        <div class="petala-suiri petala-lavanda petala-17"></div>
        <div class="petala-suiri petala-rosa    petala-18"></div>
    </div>

    <main class="container-mulher">
        <section id="secao-espaco-mulher"></section>
    </main>

    <div id="toast-container"></div>

    <script src="app-core.js"></script>
    <script src="app-saude-dicas.js"></script>
    <script src="app-saude-mulher.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const vidFundo = document.getElementById('video-cenario-fundo');
            if (vidFundo) {
                // Compatibilidade estrita para WebKit iOS (iPhone) e navegadores móveis
                vidFundo.muted = true;
                vidFundo.setAttribute('muted', '');
                vidFundo.setAttribute('playsinline', '');
                vidFundo.setAttribute('webkit-playsinline', '');

                // Trava estática: congela no último frame ao terminar a reprodução
                vidFundo.addEventListener('ended', () => {
                    vidFundo.pause();
                });

                const tentarReproduzir = () => {
                    const promessa = vidFundo.play();
                    if (promessa !== undefined) {
                        promessa.catch(() => {
                            vidFundo.load();
                            vidFundo.play().catch(() => {});
                        });
                    }
                };

                tentarReproduzir();
                document.body.addEventListener('touchstart', () => {
                    if (vidFundo.paused && !vidFundo.ended) {
                        tentarReproduzir();
                    }
                }, { once: true });
            }

            // Temporizador: 4 segundos de transparência total, depois ativa o vidro lentamente
            setTimeout(() => {
                document.body.classList.add('modo-vidro');
            }, 4000);

            const perfilRaw = localStorage.getItem('suiri_perfil_ativo') || localStorage.getItem('suiri_ultimo_perfil');
            let perfil = {};
            try {
                perfil = JSON.parse(perfilRaw || '{}');
            } catch (e) {
                perfil = {};
            }

            if (perfil.sexo && perfil.sexo.toLowerCase() === 'masculino') {
                if (typeof window.mostrarToast === 'function') {
                    window.mostrarToast("Acesso restrito ao Espaço Mulher.", "erro");
                }
                setTimeout(() => {
                    window.location.replace('index.html');
                }, 400);
                return;
            }

            window.fecharEspacoMulher = function() {
                window.location.href = 'index.html';
            };

            if (typeof window.renderizarEsqueletoEspacoMulher === 'function') {
                window.renderizarEsqueletoEspacoMulher();
                if (typeof window.processarEExibirPrevisao === 'function') window.processarEExibirPrevisao();
                if (typeof window.sincronizarCheckboxesRituaisHoje === 'function') window.sincronizarCheckboxesRituaisHoje();
                if (typeof window.calcularOfensivaERendimentoRituais === 'function') window.calcularOfensivaERendimentoRituais();
                if (typeof window.renderizarHistoricoRadarFeminilidade === 'function') window.renderizarHistoricoRadarFeminilidade();
                if (typeof window.atualizarVisualizacaoMidiaMulher === 'function') window.atualizarVisualizacaoMidiaMulher();
                if (typeof window.renderizarHistoricoAssistidosMulher === 'function') window.renderizarHistoricoAssistidosMulher();
                if (typeof window.renderizarHistoricoRituaisRetratil === 'function') window.renderizarHistoricoRituaisRetratil();

                if (typeof window.carregarDadosCicloMulher === 'function') await window.carregarDadosCicloMulher();
                if (typeof window.carregarHistoricoSintomas === 'function') await window.carregarHistoricoSintomas();
                if (typeof window.carregarDiarioMulher === 'function') await window.carregarDiarioMulher();
                if (typeof window.carregarRadarFeminilidadeNuvem === 'function') await window.carregarRadarFeminilidadeNuvem();
            }
        });
    </script>
</body>
</html>
